<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACLAR — Administration</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#1d344f;font-family:system-ui,-apple-system,sans-serif}header{background:white;padding:18px;font-weight:800;text-align:center;border-bottom:1px solid #dde5e8}main{max-width:680px;margin:auto;padding:20px}.panel{background:white;border:1px solid #e0e6e8;border-radius:17px;padding:20px;margin:14px 0}h1{font-size:25px}button{border:0;background:#ffdf72;border-radius:11px;padding:13px 18px;font-weight:800;font-size:16px;margin-right:8px;margin-top:8px}input{padding:12px;width:100%;border-radius:8px;border:1px solid #cbd6de;font-size:16px}.entry{border-top:1px solid #edf0f2;padding:13px 0}small,p{color:#5e7182}a{color:#196d94}</style></head><body><header><a href="./index.html">‹ TACLAR</a>　Administration</header><main><h1>Mon espace administrateur</h1><p>Établissements et élèves réellement enregistrés dans Firebase. Les anciennes fiches de démonstration Julian/Ntchoréré ne sont pas des inscriptions réelles.</p><section class="panel" id="auth">Vérification du compte…</section><section id="dashboard" hidden><div class="panel"><button id="schoolsBtn">Ouvrir écoles</button><button id="studentsBtn">Ouvrir élèves</button><button id="classesBtn">Ouvrir classes</button></div><section class="panel"><h2 id="heading">Écoles</h2><div id="items">Chargement…</div></section></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>(function(){firebase.initializeApp({apiKey:"AIzaSyDW8KoQvMIqpAhk3LU3mz-WRp-FWkeq0pM",authDomain:"taclar-le-tout-en-1.firebaseapp.com",projectId:"taclar-le-tout-en-1",appId:"1:1050439713834:web:1e52e255b47f961ec52f53",messagingSenderId:"1050439713834"});const db=firebase.firestore(),uid="bX1ogVwQfHUy5Qy2r1toKF5z3Hl1",auth=document.getElementById("auth"),dash=document.getElementById("dashboard");const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(kind){document.getElementById("heading").textContent={schools:"Écoles",students:"Élèves",classes:"Classes"}[kind];const out=document.getElementById("items");out.textContent="Chargement depuis Firebase…";try{const snap=await db.collection(kind).limit(100).get();out.innerHTML=snap.empty?"Aucun dossier enregistré.":snap.docs.map(d=>{const x=d.data();return '<div class="entry"><strong>'+safe(x.name||d.id)+'</strong><p>'+safe(kind==="schools"?x.location||"":kind==="students"?"Classe : "+(x.classId||""):(x.program||"") )+'</p><small>Référence : '+safe(d.id)+'</small></div>'}).join("")}catch(e){out.innerHTML='<p>Accès Firestore non encore autorisé pour le compte administrateur. Les règles devront être étendues en lecture seule.</p>'}}firebase.auth().onAuthStateChanged(u=>{if(u&&u.uid===uid){auth.hidden=true;dash.hidden=false;load("schools")}else{dash.hidden=true;auth.innerHTML='<h2>Connexion administrateur</h2><p>Connecte-toi avec ton compte TACLAR.</p><form id="form"><label>E-mail<input id="email" type="email" required></label><label>Mot de passe<input id="password" type="password" required></label><button>Se connecter</button><p id="error"></p></form>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();try{await firebase.auth().signInWithEmailAndPassword(document.getElementById("email").value.trim(),document.getElementById("password").value)}catch(x){document.getElementById("error").textContent="Connexion impossible avec ce compte."}}}});["schools","students","classes"].forEach(x=>document.getElementById(x+"Btn").onclick=()=>load(x));})();</script></body></html>
