<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACLAR — Administration</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#1d344f;font-family:system-ui,-apple-system,sans-serif}header{background:white;padding:18px;font-weight:800;text-align:center;border-bottom:1px solid #dde5e8}main{max-width:680px;margin:auto;padding:20px}.panel{background:white;border:1px solid #e0e6e8;border-radius:17px;padding:20px;margin:14px 0}h1{font-size:25px}button{border:2px solid #151515;background:#ffdf72;color:#111;border-radius:11px;padding:13px 18px;font-weight:800;font-size:16px;margin-right:8px;margin-top:8px;cursor:pointer}button:active{opacity:.8}input{padding:12px;width:100%;border-radius:8px;border:1px solid #cbd6de;font-size:16px}.entry{border-top:1px solid #edf0f2;padding:13px 0}small,p{color:#5e7182}a{color:#196d94}</style></head><body><header><a href="./index.html">‹ TACLAR</a>　Administration</header><main><h1>Mon espace administrateur</h1><p>Établissements et élèves réellement enregistrés dans Firebase. Les anciennes fiches de démonstration Julian/Ntchoréré ne sont pas des inscriptions réelles.</p><section class="panel" id="auth">Vérification du compte…</section><section id="dashboard" hidden><div class="panel" id="adminMenu"><button id="schoolsBtn">Ouvrir écoles</button><button id="studentsBtn">Ouvrir élèves</button><button id="classesBtn">Ouvrir classes</button></div><section class="panel" id="adminDetail" hidden><button id="closeAdmin" type="button">← Fermer</button><h2 id="heading">Écoles</h2><div id="items">Chargement…</div></section></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>(function(){firebase.initializeApp({apiKey:"AIzaSyDW8KoQvMIqpAhk3LU3mz-WRp-FWkeq0pM",authDomain:"taclar-le-tout-en-1.firebaseapp.com",projectId:"taclar-le-tout-en-1",appId:"1:1050439713834:web:1e52e255b47f961ec52f53",messagingSenderId:"1050439713834"});const db=firebase.firestore(),uid="bX1ogVwQfHUy5Qy2r1toKF5z3Hl1",auth=document.getElementById("auth"),dash=document.getElementById("dashboard");const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let cache={};document.getElementById("closeAdmin").onclick=()=>{document.getElementById("adminDetail").hidden=true;document.getElementById("adminMenu").hidden=false};
async function getDocs(kind){if(!cache[kind]){const snap=await db.collection(kind).limit(100).get();cache[kind]=snap.docs.map(d=>({id:d.id,...d.data()}))}return cache[kind]}
const button=(label,action,id)=>'<button type="button" data-action="'+safe(action)+'" data-id="'+safe(id)+'">'+safe(label)+'</button>';
function show(title,html){document.getElementById("adminMenu").hidden=true;document.getElementById("adminDetail").hidden=false;document.getElementById("heading").textContent=title;document.getElementById("items").innerHTML=html}
async function load(kind){
show({schools:"Écoles",students:"Élèves",classes:"Classes"}[kind],"Chargement depuis Firebase…");
try{
const docs=await getDocs(kind);
show({schools:"Écoles",students:"Élèves",classes:"Classes"}[kind],docs.length?docs.map(x=>'<div class="entry"><strong>'+safe(x.name||x.id)+'</strong><p>'+safe(kind==="schools"?x.location||"":kind==="students"?"Classe : "+(x.classId||""):x.program||"")+'</p>'+button("Ouvrir la fiche",({schools:"school",students:"student",classes:"class"}[kind]),x.id)+'</div>').join(""):"Aucun dossier enregistré.");
}catch(e){show("Accès indisponible","Impossible de consulter cette collection. Vérifie les autorisations Firebase.")}
}
async function openSchool(id){
show("Établissement","Chargement…");
try{
const [schools,classes,students]=await Promise.all([getDocs("schools"),getDocs("classes"),getDocs("students")]);
const school=schools.find(x=>x.id===id);if(!school)throw Error("École introuvable");
show(school.name,'<p>'+safe(school.location||"")+'</p><p>Année scolaire : '+safe(school.schoolYear||"Non renseignée")+'</p><h3>Classes</h3>'+(classes.filter(x=>x.schoolId===id).map(x=>'<div class="entry"><strong>'+safe(x.name)+' · '+safe(x.program||"")+'</strong>'+button("Ouvrir la classe","class",x.id)+'</div>').join("")||"<p>Aucune classe enregistrée</p>")+'<h3>Élèves</h3>'+(students.filter(x=>x.schoolId===id).map(x=>'<div class="entry"><strong>'+safe(x.name)+'</strong>'+button("Ouvrir l’élève","student",x.id)+'</div>').join("")||"<p>Aucun élève enregistré</p>")+button("← Écoles","list","schools"));
}catch(e){show("Établissement","Impossible d’ouvrir cette école.")}
}
async function openClass(id){
show("Classe","Chargement…");
try{
const [classes,students]=await Promise.all([getDocs("classes"),getDocs("students")]);
const c=classes.find(x=>x.id===id);if(!c)throw Error("Classe introuvable");
show("Classe "+c.name+' · '+(c.program||""),'<p>Année scolaire : '+safe(c.schoolYear||"Non renseignée")+'</p><h3>Élèves inscrits</h3>'+(students.filter(x=>x.classId===id).map(x=>'<div class="entry"><strong>'+safe(x.name)+'</strong>'+button("Ouvrir la fiche","student",x.id)+'</div>').join("")||"<p>Aucun élève inscrit</p>")+button("← École","school",c.schoolId));
}catch(e){show("Classe","Impossible d’ouvrir cette classe.")}
}
async function openStudent(id){
show("Élève","Chargement…");
try{
const [students,classes,schools]=await Promise.all([getDocs("students"),getDocs("classes"),getDocs("schools")]);
const child=students.find(x=>x.id===id);if(!child)throw Error("Élève introuvable");
const c=classes.find(x=>x.id===child.classId),school=schools.find(x=>x.id===child.schoolId);
show(child.name,'<p>École : '+safe(school?.name||"Non renseignée")+'</p><p>Classe : '+safe(c?.name||child.classId)+' · '+safe(c?.program||"")+'</p><h3>Planning</h3><p>Le planning personnel reste consultable par le parent autorisé. L’accès administrateur au planning n’est pas encore activé dans Firestore.</p><h3>Transport</h3><p>Les événements de transport sont encore en mode test. La future fiche détaillera les trajets autorisés pour cet élève.</p>'+button("← Classe","class",child.classId)+button("← École","school",child.schoolId));
}catch(e){show("Élève","Impossible d’ouvrir ce dossier.")}
}
document.getElementById("items").addEventListener("click",e=>{
const btn=e.target.closest("button[data-action]");if(!btn)return;
const {action,id}=btn.dataset;
if(action==="school")openSchool(id);
if(action==="class")openClass(id);
if(action==="student")openStudent(id);
if(action==="list")load(id);
});
firebase.auth().onAuthStateChanged(u=>{if(u&&u.uid===uid){auth.hidden=true;dash.hidden=false;document.getElementById("adminDetail").hidden=true;document.getElementById("adminMenu").hidden=false}else{dash.hidden=true;auth.innerHTML='<h2>Connexion administrateur</h2><p>Connecte-toi avec ton compte TACLAR.</p><form id="form"><label>E-mail<input id="email" type="email" required></label><label>Mot de passe<input id="password" type="password" required></label><button>Se connecter</button><p id="error"></p></form>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();try{await firebase.auth().signInWithEmailAndPassword(document.getElementById("email").value.trim(),document.getElementById("password").value)}catch(x){document.getElementById("error").textContent="Connexion impossible avec ce compte."}}}});["schools","students","classes"].forEach(x=>document.getElementById(x+"Btn").onclick=()=>load(x));})();</script></body></html>
